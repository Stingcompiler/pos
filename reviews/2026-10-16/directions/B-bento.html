<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B — Bento بأولوية</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0C141F;--s2:#0F1927;--s3:#131E2D;--line:rgba(255,255,255,.09);--line2:#2A3A4C;--text:#EAF0F7;--muted:#8E9DB0;--dim:#66768A;--teal:#159AA4;--teal2:#0E7C86;--warn:#E3A83C;--bad:#E66A6A;--ok:#4CC38A}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;line-height:1.6;padding:28px}
.page{max-width:1040px;margin:0 auto}h1{font-size:24px;font-weight:800}.sub{color:var(--muted);font-size:14px;margin-top:2px}
header{margin-bottom:22px}.num{font-variant-numeric:tabular-nums}.cur{font-size:.55em;color:var(--muted);font-weight:500;margin-inline-start:.35em}
a{color:var(--teal);text-decoration:none;font-weight:700;font-size:14px}h2{font-size:15px;font-weight:700;color:#C9D4E1;margin-bottom:10px}
.muted{color:var(--muted)}.warn{color:var(--warn)}.bad{color:var(--bad)}
@media(max-width:640px){body{padding:16px}h1{font-size:21px}}

.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(110px,auto);gap:14px}
.tile{border-radius:16px;padding:22px 24px;background:var(--s3);border:1px solid var(--line)}
.rev{grid-column:span 2;grid-row:span 2;background:color-mix(in srgb,var(--teal) 11%,var(--s3));border-color:rgba(21,154,164,.28);display:flex;flex-direction:column}
.debt{grid-column:span 2;background:color-mix(in srgb,var(--warn) 10%,var(--s3));border-color:rgba(227,168,60,.26)}
.k{color:var(--muted);font-size:14px}.big,.mid{font-variant-numeric:normal}.big{font-size:52px;font-weight:800;line-height:1.15;margin:8px 0 2px}.mid{font-size:34px;font-weight:800;line-height:1.2;margin:6px 0}.sm{font-size:30px;font-weight:800;margin-top:6px}
.split{margin-top:auto;padding-top:26px}.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line2)}
.bar i{display:block;background:var(--teal)}.bar i+i{background:var(--warn)}.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}.legend b{color:var(--text)}
.mv{grid-column:span 4;display:grid;grid-template-columns:repeat(4,1fr);padding:0}.mv>div{padding:16px 22px;border-inline-start:1px solid var(--line)}.mv>div:first-child{border:0}.mv .v{font-size:20px;font-weight:700;margin-top:2px}
.stk ul{list-style:none;padding:0;margin-top:10px}.stk li{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:#C9D4E1}.stk li .q{color:var(--warn)}.stk small{display:none}
.hint{color:var(--dim);font-size:13px;margin-top:6px}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.rev,.debt{grid-column:span 2}.rev{grid-row:auto}.mv{grid-column:span 2;grid-template-columns:1fr 1fr}.mv>div:nth-child(3){border-inline-start:0}.mv>div:nth-child(n+3){border-top:1px solid var(--line)}.big{font-size:42px}.split{padding-top:18px}}
</style></head><body><div class="page"><header><h1>مرحباً، مدير المحل</h1><p class="sub">الخميس ١٥ أكتوبر ٢٠٢٦ — ملخص اليوم</p></header>
<div class="grid">
<section class="tile rev"><div class="k">إيرادات اليوم (صافية)</div><div class="big"><span class="num " data-n="248000"></span><span class="cur">ج.س</span></div><div class="hint"><b>4</b> فواتير · ربح تقديري <span class="num " data-n="100000"></span></div>
<div class="split"><div class="bar"><i style="width:56%"></i><i style="width:44%"></i></div>
<div class="legend"><span>مقبوض <b class="num" data-n="140000"></b></span><span>آجل <b class="num" data-n="108000"></b></span></div></div></section>
<section class="tile debt"><div class="k">ديون العملاء المستحقة</div><div class="mid warn"><span class="num " data-n="731000"></span><span class="cur">ج.س</span></div><a href="#">عرض العملاء المدينين ←</a></section>
<section class="tile"><div class="k">قطع عند حد التنبيه</div><div class="sm warn num" data-n="5"></div><div class="hint">أقلها: رديتر لاندكروزر ٢ من ٤</div></section>
<section class="tile"><div class="k">طلبات خارجية بانتظار البيع</div><div class="sm num" data-n="2"></div><div class="hint">من الموقع الإلكتروني</div></section>
<section class="tile mv"><div><div class="k">تحصيل ديون</div><div class="v num" data-n="58000"></div></div><div><div class="k">مبيعات آجلة</div><div class="v num" data-n="108000"></div></div><div><div class="k">مرتجعات</div><div class="v muted num" data-n="0"></div></div><div><div class="k">مصروفات</div><div class="v num" data-n="15000"></div></div></section>
</div></div><script>const f=n=>new Intl.NumberFormat('ar-SA').format(n);document.querySelectorAll('[data-n]').forEach(e=>e.textContent=f(+e.dataset.n));</script></body></html>
